*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1,h2,h3{line-height:1.2;margin:.2em 0 .4em}
h1{font-size:1.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0}
.mut{color:var(--mut);font-size:.92rem}
button,select,input{font:inherit;color:var(--ink)}
button{background:var(--pri);color:var(--bg);border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:bold}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;margin:4px 0}
.opt{display:block;width:100%;text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);margin:8px 0;font-weight:normal}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt.gone{opacity:.3;text-decoration:line-through}
.sb{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:.88rem;background:var(--card)}
.chip.on{border-color:var(--pri);box-shadow:inset 0 0 0 1px var(--pri);font-weight:bold}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.pts{font-weight:bold}.p{color:var(--ok)}.m{color:var(--bad)}
.rule td,.rule th{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:.92rem}
table{border-collapse:collapse;width:100%}
.fb{padding:10px 12px;border-radius:8px;margin:10px 0}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
</style>
